<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
  html, body, #map { margin: 0; padding: 0; width: 100%; height: 100%; background: #cccccc; overflow: hidden; }
  .chip {
    background: rgba(0, 0, 0, 0.8); color: #fff; font: bold 8px sans-serif;
    padding: 2px 6px; border-radius: 3px; white-space: nowrap; line-height: 1.25;
  }
  .dot {
    width: 24px; height: 24px; border-radius: 50%; background: #000;
    border: 1px solid #fff; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
  }
  .dot svg { width: 12px; height: 12px; }
  #status {
    position: absolute; left: 4px; bottom: 4px; z-index: 10; display: none;
    background: rgba(255,255,255,.9); color: #000; font: 10px monospace;
    padding: 4px; max-width: 90%; word-break: break-all;
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="status"></div>
<script src="maplibre-gl.js"></script>
<script src="pmtiles.js"></script>
<script>
'use strict';
const statusEl = document.getElementById('status');
const errors = [];
window.onerror = (msg) => { errors.push(String(msg)); renderStatus(); };
function renderStatus(extra) {
  let layerCount = 0;
  let imageCount = -1;
  try {
    layerCount = map && map.getStyle() ? (map.getStyle().layers || []).length : 0;
  } catch (e) {}
  try {
    imageCount = map && map.listImages ? map.listImages().length : -1;
  } catch (e) {}
  statusEl.textContent = JSON.stringify(Object.assign({
    ready: !!window._mapReady, layers: layerCount, images: imageCount,
    errors: errors,
  }, extra || {}));
}
function post(obj) {
  const s = JSON.stringify(obj);
  if (window.LbjBridge) { LbjBridge.postMessage(s); }
  console.log('[lbj]', s);
}

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', protocol.tile);

let map = null;
let chipMarkers = new Map();
let dotMarkers = new Map();
let hits = [];
let ormOn = true;
let darkMode = false;
let lastData = null;

// The style pipeline is rail.nedifinita.com's, ported piece for
// piece: the railway style arrives already preprocessed by the
// Dart port of rail's backend rewrite (orm_style.dart), and this
// page merges it with the OpenFreeMap liberty basemap using rail's
// frontend combine (web/src/MapView.vue: combineMapStyles,
// sansSerifTextLayer, forceSansSerifLabels and the raster fallback
// on vector errors). Two transport substitutions, both because the
// app has no origin on rail's host: the ORM sprite atlases are
// fetched by Dart and served to the style through the ormsprite
// protocol below (openrailwaymap.app sends no CORS headers), and
// the fallback's raster tiles come from tiles.openrailwaymap.org
// directly instead of through rail's /api/map/orm-tiles proxy.
const LIBERTY_STYLE_URL = 'https://tiles.openfreemap.org/styles/liberty';
const ORM_RASTER_TILE_URL =
  'https://tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png';

const spriteStore = {};
function b64ToBuffer(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
maplibregl.addProtocol('ormsprite', (params) => {
  const m = /^ormsprite:\/\/([^/@]+)\//.exec(params.url);
  const ext = /\.json$/.test(params.url)
    ? 'json'
    : /\.png$/.test(params.url)
      ? 'png'
      : null;
  const entry = m ? spriteStore[m[1]] : null;
  const data = entry && ext ? entry[ext] : null;
  if (!data) {
    return Promise.reject(new Error('unknown sprite request: ' + params.url));
  }
  // The JSON side must arrive parsed: GL JS takes a protocol
  // response's data as final, and iterating an ArrayBuffer as the
  // atlas object silently yields no images at all.
  if (ext === 'json') {
    return Promise.resolve({
      data: JSON.parse(new TextDecoder().decode(data)),
    });
  }
  return Promise.resolve({ data: data });
});

let baseStyleRef = null;
let combinedStyle = null;
let railwayRasterFallbackStyle = null;
let railwayRasterFallbackActive = false;
let styleIsCombined = false;

function sansSerifTextLayer(layer) {
  const families = layer.layout && layer.layout['text-font'];
  if (layer.type !== 'symbol' || !families) return layer;
  const source = Array.isArray(families) ? families.join(' ') : String(families);
  const font = /bold/i.test(source) ? 'Noto Sans Bold' : /italic/i.test(source) ? 'Noto Sans Italic' : 'Noto Sans Regular';
  return { ...layer, layout: { ...layer.layout, 'text-font': [font] } };
}

function combineMapStyles(baseStyle, railwayStyle) {
  const railwaySources = railwayStyle.sources || {};
  const sources = { ...baseStyle.sources };
  for (const [name, source] of Object.entries(railwaySources)) {
    const mergedSource = { ...source };
    if (source.type === 'geojson' && !source.data && !source.url) {
      mergedSource.data = { type: 'FeatureCollection', features: [] };
    }
    sources[`orm-${name}`] = mergedSource;
  }

  const prefixSpriteExpression = (value, spriteId) => {
    if (typeof value === 'string') {
      return value && !value.includes(':') ? `${spriteId}:${value}` : value;
    }
    if (!Array.isArray(value)) return value;

    const [operator, ...args] = value;
    if (operator === 'literal' && typeof args[0] === 'string') {
      return ['literal', prefixSpriteExpression(args[0], spriteId)];
    }
    if (operator === 'image') return ['image', prefixSpriteExpression(args[0], spriteId)];
    if (operator === 'concat') {
      if (typeof args[0] === 'string' && args[0].startsWith(`${spriteId}:`)) return value;
      return ['concat', `${spriteId}:`, ...args];
    }
    if (operator === 'case') {
      const rewritten = [operator];
      for (let i = 0; i < args.length - 1; i += 2) {
        rewritten.push(args[i], prefixSpriteExpression(args[i + 1], spriteId));
      }
      if (args.length % 2 === 1) rewritten.push(prefixSpriteExpression(args.at(-1), spriteId));
      return rewritten;
    }
    if (operator === 'match') {
      const rewritten = [operator, args[0]];
      for (let i = 1; i < args.length - 1; i += 2) {
        rewritten.push(args[i], prefixSpriteExpression(args[i + 1], spriteId));
      }
      if (args.length % 2 === 0) rewritten.push(prefixSpriteExpression(args.at(-1), spriteId));
      return rewritten;
    }
    if (operator === 'step') {
      const rewritten = [operator, args[0], prefixSpriteExpression(args[1], spriteId)];
      for (let i = 2; i < args.length; i += 2) rewritten.push(args[i], prefixSpriteExpression(args[i + 1], spriteId));
      return rewritten;
    }
    if (['interpolate', 'interpolate-hcl', 'interpolate-lab', 'interpolate-rgb'].includes(operator)) {
      const rewritten = [operator, args[0], args[1]];
      for (let i = 2; i < args.length; i += 2) rewritten.push(args[i], prefixSpriteExpression(args[i + 1], spriteId));
      return rewritten;
    }
    if (operator === 'coalesce') return [operator, ...args.map(arg => prefixSpriteExpression(arg, spriteId))];
    if (operator === 'let') return [...value.slice(0, -1), prefixSpriteExpression(value.at(-1), spriteId)];
    return ['concat', `${spriteId}:`, value];
  };

  const baseSpriteIsSingle = typeof baseStyle.sprite === 'string';
  const baseSprites = baseSpriteIsSingle
    ? [{ id: 'ofm', url: baseStyle.sprite }]
    : Array.isArray(baseStyle.sprite) ? baseStyle.sprite : [];
  const railwaySprites = typeof railwayStyle.sprite === 'string'
    ? [{ id: 'orm', url: railwayStyle.sprite }]
    : Array.isArray(railwayStyle.sprite) ? railwayStyle.sprite : [];
  const spriteIds = new Set();
  for (const sprite of [...baseSprites, ...railwaySprites]) {
    if (spriteIds.has(sprite.id)) throw new Error(`duplicate map sprite id: ${sprite.id}`);
    spriteIds.add(sprite.id);
  }

  const rewriteBaseSprites = layer => {
    if (!baseSpriteIsSingle) return layer;
    const rewritten = { ...layer, layout: { ...layer.layout }, paint: { ...layer.paint } };
    if (rewritten.layout['icon-image'] !== undefined) {
      rewritten.layout['icon-image'] = prefixSpriteExpression(rewritten.layout['icon-image'], 'ofm');
    }
    for (const property of ['fill-pattern', 'line-pattern', 'background-pattern', 'fill-extrusion-pattern']) {
      if (rewritten.paint[property] !== undefined) {
        rewritten.paint[property] = prefixSpriteExpression(rewritten.paint[property], 'ofm');
      }
    }
    return rewritten;
  };

  const baseLayers = (baseStyle.layers || []).map(rewriteBaseSprites).map(sansSerifTextLayer);
  const railwayLayers = (railwayStyle.layers || []).map(layer => ({
    ...layer,
    id: `orm-${layer.id}`,
    ...(layer.source ? { source: `orm-${layer.source}` } : {}),
    ...(layer.ref ? { ref: `orm-${layer.ref}` } : {})
  })).map(sansSerifTextLayer);
  const baseGeometryLayers = baseLayers.filter(layer => layer.type !== 'symbol');
  const railwayGeometryLayers = railwayLayers.filter(layer => layer.type !== 'symbol');
  const railwayLabelLayers = railwayLayers.filter(layer => layer.type === 'symbol');
  const baseLabelLayers = baseLayers.filter(layer => layer.type === 'symbol');
  const layers = [
    ...baseGeometryLayers,
    ...railwayGeometryLayers,
    ...railwayLabelLayers,
    ...baseLabelLayers
  ];
  const style = {
    ...baseStyle,
    sprite: [...baseSprites, ...railwaySprites],
    glyphs: baseStyle.glyphs || railwayStyle.glyphs,
    state: { ...(baseStyle.state || {}), ...(railwayStyle.state || {}) },
    sources,
    layers
  };

  const fallbackSources = { ...baseStyle.sources };
  fallbackSources['orm-raster-fallback'] = {
    type: 'raster',
    tiles: [ORM_RASTER_TILE_URL],
    tileSize: 512,
    minzoom: 0,
    maxzoom: 19
  };
  const fallbackLayers = [
    ...(baseStyle.layers || []).filter(layer => layer.type !== 'symbol'),
    { id: 'orm-raster-fallback', type: 'raster', source: 'orm-raster-fallback' },
    ...(baseStyle.layers || []).filter(layer => layer.type === 'symbol')
  ];

  return {
    style,
    fallbackStyle: { ...baseStyle, sources: fallbackSources, layers: fallbackLayers }
  };
}

function forceSansSerifLabels() {
  if (!map) return;
  const layers = (map.getStyle() && map.getStyle().layers) || [];
  for (const layer of layers) {
    const normalized = sansSerifTextLayer(layer);
    const font = normalized.layout && normalized.layout['text-font'];
    if (font && JSON.stringify((layer.layout || {})['text-font']) !== JSON.stringify(font)) {
      map.setLayoutProperty(layer.id, 'text-font', font);
    }
  }
}

function cloneStyle(style) {
  return JSON.parse(JSON.stringify(style));
}

function handleRailwayVectorError(event) {
  if (railwayRasterFallbackActive || !map) return;
  const url = (event && event.error && event.error.url) || (event && event.url) || '';
  if (!url.includes('ormsprite') && !url.includes('orm.pmtiles')) return;
  if (!railwayRasterFallbackStyle) return;
  railwayRasterFallbackActive = true;
  styleIsCombined = false;
  map.setStyle(cloneStyle(railwayRasterFallbackStyle));
}

function applyTheme() {
  if (map && styleIsCombined) {
    try { map.setGlobalStateProperty('theme', darkMode ? 'dark' : 'light'); } catch (e) {}
  }
}

// The app's own overlays ride on top of whatever style is current;
// a setStyle (railway toggle, raster fallback) wipes them, so they
// are (re)added on every style.load and the last data reapplied.
function ensureOverlays() {
  if (!map) return;
  if (!map.getSource('lbj-lines')) {
    map.addSource('lbj-lines', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] },
    });
    map.addLayer({
      id: 'lbj-lines', type: 'line', source: 'lbj-lines',
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': '#000000', 'line-width': 4 },
    });
  }
  if (lastData) applyLines(lastData);
}

function applyLines(data) {
  if (!map || !map.getSource('lbj-lines')) return;
  map.getSource('lbj-lines').setData({
    type: 'FeatureCollection',
    features: (data.lines || []).map((pts) => ({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: pts },
      properties: {},
    })),
  });
}

const TRAIN_SVG = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 3c-4.4 0-7 .9-7 3.2V16c0 1.7 1.3 3 3 3l-1.3 2h1.8L10 19h4l1.5 2h1.8L16 19c1.7 0 3-1.3 3-3V6.2C19 3.9 16.4 3 12 3zM8.2 15.8c-.9 0-1.6-.7-1.6-1.6s.7-1.6 1.6-1.6 1.6.7 1.6 1.6-.7 1.6-1.6 1.6zm7.6 0c-.9 0-1.6-.7-1.6-1.6s.7-1.6 1.6-1.6 1.6.7 1.6 1.6-.7 1.6-1.6 1.6zM17 10H7V6.4c.6-.3 2.2-.8 5-.8s4.4.5 5 .8V10z"/></svg>';
const LOCATION_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="#fff" stroke="none"/></svg>';

// opts: {center: [lng, lat], zoom, bearing, minZoom, maxZoom,
//        interactive, orm, dark, ormStyle, ormSprites}
window.LbjInit = async function (opts) {
  opts = opts || {};
  ormOn = opts.orm !== false;
  darkMode = !!opts.dark;
  for (const [id, files] of Object.entries(opts.ormSprites || {})) {
    spriteStore[id] = {
      json: b64ToBuffer(files.json),
      png: b64ToBuffer(files.png),
    };
  }
  let baseStyle;
  try {
    const response = await fetch(LIBERTY_STYLE_URL);
    if (!response.ok) throw new Error(`base style ${response.status}`);
    baseStyle = await response.json();
  } catch (e) {
    post({ t: 'error', message: String(e) });
    return;
  }
  baseStyleRef = baseStyle;
  let style = baseStyle;
  if (opts.ormStyle) {
    let combined;
    try {
      combined = combineMapStyles(baseStyle, opts.ormStyle);
    } catch (e) {
      post({ t: 'error', message: String(e) });
      return;
    }
    combinedStyle = combined.style;
    railwayRasterFallbackStyle = combined.fallbackStyle;
    styleIsCombined = ormOn;
    style = ormOn ? combinedStyle : baseStyle;
  }
  map = new maplibregl.Map({
    container: 'map',
    style: style,
    center: opts.center || [116.4074, 39.9042],
    zoom: opts.zoom != null ? opts.zoom : 14,
    bearing: opts.bearing || 0,
    minZoom: opts.minZoom != null ? opts.minZoom : 2,
    maxZoom: opts.maxZoom != null ? opts.maxZoom : 18,
    // The camera stays inside the world: without bounds a fast
    // fling's inertia carries the centre past the mercator edge
    // and the map sails off into empty background.
    maxPitch: 0,
    pitchWithRotate: false,
    dragRotate: opts.interactive !== false,
    crossSourceCollisions: true,
    attributionControl: false,
    interactive: opts.interactive !== false,
    touchPitch: false,
    pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    fadeDuration: 0,
    maxTileCacheSize: 256,
  });
  map.on('style.load', () => {
    forceSansSerifLabels();
    ensureOverlays();
    applyTheme();
    if (!window._mapReady) {
      window._mapReady = true;
      renderStatus();
      post({ t: 'ready' });
    }
  });
  map.on('error', handleRailwayVectorError);
  map.on('moveend', () => {
    const c = map.getCenter();
    post({ t: 'camera', lng: c.lng, lat: c.lat, zoom: map.getZoom(), bearing: map.getBearing() });
  });
  map.on('click', (e) => {
    let best = null;
    let bestDistance = 28;
    for (const h of hits) {
      const p = map.project([h.lng, h.lat]);
      const dx = p.x - e.point.x;
      const dy = p.y - e.point.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestDistance) { bestDistance = d; best = h; }
    }
    if (best) { post({ t: 'chipTap', id: best.id }); }
    else { post({ t: 'tap', lng: e.lngLat.lng, lat: e.lngLat.lat }); }
  });
};

// data: {lines: [[[lng, lat], ...], ...],
//        chips: [{id, lng, lat, label}],
//        dots: [{lng, lat, kind: 'train' | 'location'}],
//        hits: [{id, lng, lat}]}
window.LbjSetData = function (data) {
  data = data || {};
  lastData = data;
  hits = data.hits || [];
  applyLines(data);
  if (!map) return;
  // Markers are maintained incrementally, keyed: a data push
  // moves and relabels the markers it already has and only
  // creates or removes the difference. Tearing every marker down
  // and rebuilding the set on each push made the whole overlay
  // blink off and back on for every selection change.
  const seenChips = new Set();
  for (const chip of data.chips || []) {
    seenChips.add(chip.id);
    const existing = chipMarkers.get(chip.id);
    if (existing) {
      existing.marker.setLngLat([chip.lng, chip.lat]);
      if (existing.label !== chip.label) {
        existing.el.textContent = chip.label;
        existing.label = chip.label;
      }
      continue;
    }
    const el = document.createElement('div');
    el.className = 'chip';
    el.textContent = chip.label;
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      post({ t: 'chipTap', id: chip.id });
    });
    const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([chip.lng, chip.lat]).addTo(map);
    chipMarkers.set(chip.id, { marker, el, label: chip.label });
  }
  for (const [id, entry] of chipMarkers) {
    if (!seenChips.has(id)) {
      entry.marker.remove();
      chipMarkers.delete(id);
    }
  }
  const seenDots = new Set();
  for (const dot of data.dots || []) {
    const key = dot.kind + '|' + dot.lng + '|' + dot.lat;
    seenDots.add(key);
    if (dotMarkers.has(key)) continue;
    const el = document.createElement('div');
    el.className = 'dot';
    el.innerHTML = dot.kind === 'location' ? LOCATION_SVG : TRAIN_SVG;
    const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([dot.lng, dot.lat]).addTo(map);
    dotMarkers.set(key, marker);
  }
  for (const [key, marker] of dotMarkers) {
    if (!seenDots.has(key)) {
      marker.remove();
      dotMarkers.delete(key);
    }
  }
};

window.LbjMoveTo = function (lng, lat, zoom, bearing) {
  if (!map) return;
  map.jumpTo({
    center: [lng, lat],
    zoom: zoom != null ? zoom : map.getZoom(),
    bearing: bearing != null ? bearing : map.getBearing(),
  });
};

window.LbjFitBounds = function (points, padding, maxZoom) {
  if (!map || !points || !points.length) return;
  const bounds = new maplibregl.LngLatBounds(points[0], points[0]);
  for (const p of points) bounds.extend(p);
  map.fitBounds(bounds, { padding: padding || 0, maxZoom: maxZoom || 16, duration: 0 });
};

window.LbjSetOrm = function (on) {
  ormOn = !!on;
  if (!map || !combinedStyle || !baseStyleRef) return;
  railwayRasterFallbackActive = false;
  styleIsCombined = ormOn;
  map.setStyle(cloneStyle(ormOn ? combinedStyle : baseStyleRef));
};

window.LbjSetTheme = function (dark) {
  darkMode = !!dark;
  applyTheme();
};

if (new URLSearchParams(location.search).has('test')) {
  statusEl.style.display = 'block';
  Promise.all([
    fetch('orm-rewritten.json').then((r) => r.json()),
    fetch('orm-sprites.json').then((r) => r.json()),
  ])
    .then(([ormStyle, ormSprites]) => {
      window.LbjInit({
        center: [121.47, 31.23], zoom: 12, interactive: true,
        orm: true, dark: false, ormStyle: ormStyle, ormSprites: ormSprites,
      });
      const wait = setInterval(() => {
        if (window._mapReady) {
          clearInterval(wait);
          window.LbjSetData({
            lines: [[[121.40, 31.20], [121.44, 31.225], [121.47, 31.24], [121.50, 31.26]]],
            chips: [{ id: 'r1', lng: 121.50, lat: 31.26, label: 'G1234' }],
            dots: [{ lng: 121.44, lat: 31.225, kind: 'location' }],
            hits: [{ id: 'r1', lng: 121.50, lat: 31.26 }, { id: 'r2', lng: 121.44, lat: 31.225 }],
          });
          setTimeout(() => {
            let sample = [];
            try { sample = map.listImages().slice(0, 8); } catch (e) {}
            renderStatus({ seeded: true, imageSample: sample });
          }, 1500);
        }
      }, 200);
    })
    .catch((e) => { errors.push('orm fetch: ' + e); renderStatus(); });
}
</script>
</body>
</html>
