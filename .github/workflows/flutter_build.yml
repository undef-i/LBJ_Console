name: Flutter Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Update compileSdkVersion
        run: |
          sed -i 's/compileSdk = 35/compileSdk = 36/g' android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Create keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build APK
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}


      - name: Rename APK with tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp build/app/outputs/flutter-apk/app-$abi-release.apk LBJ_Console_${TAG_NAME}_$abi.apk
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            LBJ_Console_${{ github.ref_name }}_arm64-v8a.apk
            LBJ_Console_${{ github.ref_name }}_armeabi-v7a.apk
            LBJ_Console_${{ github.ref_name }}_x86_64.apk
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false